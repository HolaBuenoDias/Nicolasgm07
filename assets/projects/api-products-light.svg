<svg xmlns="http://www.w3.org/2000/svg" width="490" height="256" viewBox="0 0 490 256" role="img" aria-label="API de productos — Api_products: API REST de productos y categorías con Spring Boot y MySQL." fill="none"><title>API de productos — Api_products: API REST de productos y categorías con Spring Boot y MySQL.</title><desc>Tarjeta del repositorio Api_products (Java, Spring Boot, MySQL). Esquema relacional: muchos productos pertenecen a una categoría (categoria_id → id). Ruta base de la API: /api/productos.</desc><style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.fade{animation:fade .9s ease backwards}
@keyframes fade{from{opacity:0}}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.slide{animation:slide .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ping{animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.6)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.win{animation:win .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes win{from{opacity:0;transform:translateY(12px)}}
.nudge{animation:nudge 4.8s ease-in-out 2.4s infinite}
@keyframes nudge{0%,72%,100%{transform:none}80%{transform:translate(2px,-2px)}88%{transform:none}}
.pk{animation:pk 4.2s ease-in-out 1.6s infinite backwards}
@keyframes pk{0%,8%{opacity:0;transform:translateX(0)}14%,40%{opacity:1}46%,100%{opacity:0;transform:translateX(var(--d))}}
.hl{opacity:0;animation:hl 4.2s ease-in-out 1.6s infinite backwards}
@keyframes hl{0%,6%{opacity:0}14%,52%{opacity:1}66%,100%{opacity:0}}
