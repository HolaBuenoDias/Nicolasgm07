<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Gracias por pasarte por mi perfil" fill="none"><title>Gracias por pasarte por mi perfil</title><desc>Pie del perfil con el monograma NG. Hecho con SVG, Python y GitHub Actions · El Viso del Alcor, Sevilla.</desc><style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.fade{animation:fade .9s ease backwards}
@keyframes fade{from{opacity:0}}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.slide{animation:slide .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ping{animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.6)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gla{animation:gla 7s 2.4s cubic-bezier(.45,0,.3,1) infinite backwards}@keyframes gla{0%{transform:translateX(0)}30%,100%{transform:translateX(-386px)}}.glb{animation:glb 7s 2.4s cubic-bezier(.45,0,.3,1) infinite backwards}@keyframes glb{0%{transform:translateX(0)}30%,100%{transform:translateX(386px)}}.tsh{animation:tsh 7s 2.1s cubic-bezier(.45,0,.3,1) infinite backwards}@keyframes tsh{0%{transform:translateX(0)}14%,100%{transform:translateX(144px)}}</style><defs><linearGradient id="ft" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#FFB347"/><stop offset="1" stop-color="#F2511B"/></linearGradient><filter id="fg" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#F2511B" flood-opacity="0.4"/></filter><linearGradient id="la" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="446" y2="0"><stop offset="0" stop-color="#FFB347" stop-opacity="0"/><stop offset="1" stop-color="#F2511B"/></linearGradient><linearGradient id="lb" gradientUnits="userSpaceOnUse" x1="554" y1="0" x2="850" y2="0"><stop offset="0" stop-color="#F2511B"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></linearGradient><clipPath id="ca"><rect x="150" y="45.0" width="296" height="6"/></clipPath><clipPath id="cb"><rect x="554" y="45.0" width="296" height="6"/></clipPath><clipPath id="ct"><rect x="468" y="16" width="64" height="64" rx="19" fill="none" /></clipPath><linearGradient id="ts" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path class="draw" style="animation-delay:.35s;animation-duration:1.3s" pathLength="1" d="M446 48H150" stroke="url(#la)" stroke-width="2" stroke-linecap="round"/><path class="draw" style="animation-delay:.35s;animation-duration:1.3s" pathLength="1" d="M554 48H850" stroke="url(#lb)" stroke-width="2" stroke-linecap="round"/><g clip-path="url(#ca)"><rect class="gla" x="446" y="46.5" width="90" height="3" rx="1.5" fill="url(#gl)"/></g><g clip-path="url(#cb)"><rect class="glb" x="464" y="46.5" width="90" height="3" rx="1.5" fill="url(#gl)"/></g><g class="pop" style="animation-delay:.05s"><g filter="url(#fg)"><rect x="468" y="16" width="64" height="64" rx="19" fill="url(#ft)" /></g><g clip-path="url(#ct)"><path class="tsh" d="M408 80l22 -64h30l-22 64Z" fill="url(#ts)"/></g><rect x="468.5" y="16.5" width="63" height="63" rx="18.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity=".25"/><g transform="translate(471.84 19.84) scale(0.5632)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path class="draw" style="animation-delay:0.45s;animation-duration:1.3s" pathLength="1" d="M22 72V28L46 72H67a12 12 0 0 0 12-12V52H63"/><path class="draw" style="animation-delay:1.20s;animation-duration:.9s" pathLength="1" d="M79 28H56a10 10 0 0 0-10 10V72"/></g></g><text class="rise" style="animation-delay:.25s" x="500" y="128" font-size="26" font-weight="800" letter-spacing="-.5" fill="#e6edf3" text-anchor="middle">Gracias por pasarte por mi perfil</text><text class="fade" style="animation-delay:.45s" x="500" y="157" font-size="14" fill="#9198a1" text-anchor="middle" xml:space="preserve">Hecho con SVG, Python y GitHub Actions<tspan fill="#FF7A45" font-weight="700">  ·  </tspan>El Viso del Alcor, Sevilla</text></svg>
