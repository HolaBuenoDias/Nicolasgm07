<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-label="Línea temporal: SMR 2023–2025, Bastilipo 2025–2026, DAW 2025–2027 y prácticas de febrero a mayo de 2027" fill="none"><title>Línea temporal: SMR 2023–2025, Bastilipo 2025–2026, DAW 2025–2027 y prácticas de febrero a mayo de 2027</title><style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans',Arial,sans-serif}
