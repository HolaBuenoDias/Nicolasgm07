<svg xmlns="http://www.w3.org/2000/svg" width="360" height="80" viewBox="0 0 360 80" role="img" aria-label="Gana la CPU" fill="none"><title>Gana la CPU</title><desc>Estado del tres en raya: Gana la CPU. Esta vez no ha podido ser.</desc><style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.fade{animation:fade .9s ease backwards}
@keyframes fade{from{opacity:0}}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.slide{animation:slide .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ping{animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.6)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
.spark{animation:spark 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
</style><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F1C"/><stop offset="1" stop-color="#F2511B"/></linearGradient></defs><g class="pop"><rect x="0.75" y="12.75" width="54.5" height="54.5" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><g transform="translate(14 26) scale(1.16667)" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.2"/><rect x="9.6" y="9.6" width="4.8" height="4.8" rx=".8"/><path d="M9.5 2.8V6M14.5 2.8V6M9.5 18v3.2M14.5 18v3.2M2.8 9.5H6M2.8 14.5H6M18 9.5h3.2M18 14.5h3.2"/></g></g><text class="mono fade" style="animation-delay:.15s" x="72" y="25" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#59636e">PARTIDA TERMINADA</text><text class="rise" style="animation-delay:.2s" x="70.5" y="54" font-size="28" font-weight="800" letter-spacing="-.6" fill="#1f2328">Gana la CPU</text><text class="rise" style="animation-delay:.3s" x="72" y="74" font-size="14.5" fill="#59636e">Esta vez no ha podido ser</text></svg>
