<svg xmlns="http://www.w3.org/2000/svg" width="360" height="80" viewBox="0 0 360 80" role="img" aria-label="¡Has ganado! Los visitantes se llevan la partida" fill="none"><title>¡Has ganado! Los visitantes se llevan la partida</title><desc>Estado del tres en raya: ¡Has ganado!. Los visitantes se llevan la partida.</desc><style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.fade{animation:fade .9s ease backwards}
@keyframes fade{from{opacity:0}}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.slide{animation:slide .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ping{animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.6)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
.spark{animation:spark 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
</style><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F1C"/><stop offset="1" stop-color="#F2511B"/></linearGradient></defs><g class="pop"><rect x="0.75" y="12.75" width="54.5" height="54.5" rx="16" fill="url(#sg)" /><g transform="translate(14 26) scale(1.16667)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4h9v5.2a4.5 4.5 0 0 1-9 0V4Z"/><path d="M7.5 6.2H5.2a.7.7 0 0 0-.7.8 3.6 3.6 0 0 0 3.3 3.1"/><path d="M16.5 6.2h2.3a.7.7 0 0 1 .7.8 3.6 3.6 0 0 1-3.3 3.1"/><path d="M12 13.7V17"/><path d="M8.5 20.2h7"/><path d="M9.6 17h4.8l.6 3.2H9l.6-3.2Z"/></g></g><g class="spark" style="animation-delay:0.60s"><g transform="translate(52 6) scale(0.541667)" fill="none" stroke="#FF9F1C" stroke-width="2.95" stroke-linecap="round" stroke-linejoin="round" color="#FF9F1C" ><path d="M12 3c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7Z"/><path d="M19 15.5c.2 1.4.9 2.1 2.3 2.3-1.4.2-2.1.9-2.3 2.3-.2-1.4-.9-2.1-2.3-2.3 1.4-.2 2.1-.9 2.3-2.3Z"/></g></g><g class="spark" style="animation-delay:1.10s"><g transform="translate(60 52) scale(0.375)" fill="none" stroke="#FF9F1C" stroke-width="4.27" stroke-linecap="round" stroke-linejoin="round" color="#FF9F1C" ><path d="M12 3c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7Z"/><path d="M19 15.5c.2 1.4.9 2.1 2.3 2.3-1.4.2-2.1.9-2.3 2.3-.2-1.4-.9-2.1-2.3-2.3 1.4-.2 2.1-.9 2.3-2.3Z"/></g></g><g class="spark" style="animation-delay:1.60s"><g transform="translate(-2 58) scale(0.333333)" fill="none" stroke="#FF9F1C" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" color="#FF9F1C" ><path d="M12 3c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7Z"/><path d="M19 15.5c.2 1.4.9 2.1 2.3 2.3-1.4.2-2.1.9-2.3 2.3-.2-1.4-.9-2.1-2.3-2.3 1.4-.2 2.1-.9 2.3-2.3Z"/></g></g><text class="mono fade" style="animation-delay:.15s" x="72" y="25" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#59636e">PARTIDA TERMINADA</text><text class="rise" style="animation-delay:.2s" x="70.5" y="54" font-size="28" font-weight="800" letter-spacing="-.6" fill="#1f2328">¡Has ganado!</text><text class="rise" style="animation-delay:.3s" x="72" y="74" font-size="14.5" fill="#59636e">Los visitantes se llevan la partida</text></svg>
