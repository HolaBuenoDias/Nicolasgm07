<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Casilla A1 libre" fill="none"><title>Casilla A1 libre</title><desc>Casilla A1 del tres en raya, libre: púlsala para jugar ahí.</desc><style>
text{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Code','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.fade{animation:fade .9s ease backwards}
@keyframes fade{from{opacity:0}}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.slide{animation:slide .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ping{animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.6)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.st{stroke-dasharray:1;animation:st .42s cubic-bezier(.65,0,.35,1) backwards}
@keyframes st{from{stroke-dashoffset:1;opacity:0}12%{opacity:1}}
.ring{stroke-dasharray:1;animation:st .6s cubic-bezier(.65,0,.35,1) backwards}
.plus{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.9)}45%{opacity:1;transform:scale(1.1)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}
.hl{animation:hl 2.6s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:.7}50%{opacity:1}}
.dot{animation:pop .5s cubic-bezier(.2,1.5,.4,1) .55s backwards;transform-box:fill-box;transform-origin:center}
</style><defs></defs><rect x="5" y="5" width="90" height="90" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.0" /><text class="mono" x="16" y="26.5" font-size="13.5" font-weight="600" letter-spacing=".4" fill="#59636e">A1</text><g class="plus" style="animation-delay:0.00s"><path d="M50.0 42.0V58.0M42.0 50.0H58.0" stroke="#818b98" stroke-width="2.6" stroke-linecap="round"/></g></svg>
