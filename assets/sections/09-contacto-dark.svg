"972" cy="50" r="23.5" stroke="#F2511B" stroke-width="1.5"/><g class="pop" style="animation-delay:1.3s"><circle cx="972" cy="50" r="23.5" fill="#161b22" stroke="rgba(242,81,27,0.45)"/><g transform="translate(961 39) scale(0.916667)" fill="none" stroke="#FF7A45" stroke-width="2.07" stroke-linecap="round" stroke-linejoin="round" color="#FF7A45" ><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.8 7l8.2 6 8.2-6"/></g></g></svg>
