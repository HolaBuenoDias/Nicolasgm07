# Genera cada día las imágenes dinámicas del perfil (la serpiente de siempre, estadísticas,
# lenguajes y cuenta atrás de prácticas) y las publica juntas en la rama "output",
# que es de donde las lee el README. Sustituye al antiguo snake.yml: si publicasen dos
# workflows en "output", cada uno borraría lo del otro.
name: Perfil dinámico

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # La serpiente, exactamente igual que antes
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0969da
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#79c0ff

      - name: Estadísticas, lenguajes y cuenta atrás
        run: python3 scripts/dynamic/generate.py --out dist
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
