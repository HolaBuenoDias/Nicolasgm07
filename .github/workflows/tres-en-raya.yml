# Tres en raya comunitario: cada casilla del README abre un issue «ttt|move|N».
# Este workflow aplica la jugada, responde la CPU, actualiza el README y cierra el issue.
# Los datos del issue se leen del JSON del evento en Python, nunca se interpolan aquí.
name: Tres en raya

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tres-en-raya
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Aplicar la jugada
        run: python3 scripts/game/ttt.py --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/ttt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar el tablero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/game/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -F "$RUNNER_TEMP/ttt/commit.txt"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Responder y cerrar el issue
        run: python3 scripts/game/ttt.py --reply "$RUNNER_TEMP/ttt/replies.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Avisar si algo falló
        if: failure()
        run: python3 scripts/game/ttt.py --apologize "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
